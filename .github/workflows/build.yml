name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
# One run per tag at a time. GitHub has delivered a tag push twice (v0.1.14); two runs
# at once each uploaded their own zip and left the bucket with the other one's hash.
# Serialised, the second run finds the release published and skips it (see below).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --publish never
        env:
          # Signing credentials go here when they exist; see docs/PACKAGING.md section 3.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: node scripts/checksums.mjs release
      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS
      - name: Release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" release/NOTES.md "${{ github.repository }}"
      # A release that already carries SHA256SUMS was published by an earlier run for
      # this tag. Uploading again would replace its files with a new build whose hashes
      # differ from the bucket's. To rebuild a release on purpose, delete its assets first.
      - name: Check whether the release is already published
        id: published
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME already has its files; skipping the upload and the bucket update."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && steps.published.outputs.already != 'true'
        uses: softprops/action-gh-release@v3
        with:
          body_path: release/NOTES.md
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS
      - name: Update the Scoop bucket
        if: startsWith(github.ref, 'refs/tags/v') && steps.published.outputs.already != 'true'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/update-bucket.mjs "$VERSION" release/SHA256SUMS "${{ github.repository }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add bucket/pocket-service-manager.json
          git commit -m "Bucket: $VERSION" || echo "no bucket change"
          git push origin main
  # macos:  # phase 3: runs-on macos-latest, DMG, notarisation

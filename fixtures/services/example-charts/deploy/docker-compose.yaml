# example-charts backend on the supplier host (example-host).
#
# One supplier serves every service it is staked for through one HA RelayMiner stack.
# That stack (redis + miner + relayer + Caddy) lives in
# /opt/pocket/supplier (see servers/example-host/) and owns the network below. This
# file adds only the Example Charts backend to that network; the relayer reaches it as
# http://example-charts-backend:8080 once relayer-service.yaml is merged into the
# relayer config (see add-to-relayer.sh). Nothing here is exposed to the internet.
#
#   docker compose -f docker-compose.yaml up -d --build

services:
  backend:
    build: ../backend
    image: example-charts-backend:1.0.0
    container_name: example-charts-backend
    restart: unless-stopped
    environment:
      PC_WORKERS: "2"                 # render threads; each holds its own Vega runtime
      PC_MAX_BODY_BYTES: "1048576"    # 1 MiB request body
      PC_MAX_ROWS: "50000"
      PC_MAX_MARKS: "10000"
      PC_MAX_SVG_BYTES: "2097152"     # 2 MiB output
      PC_RENDER_BUDGET_MS: "5000"     # well inside the gateway's relay budget
    mem_limit: 768m
    expose:
      - "8080"
    networks: [supplier]

networks:
  supplier:
    external: true
    name: pocket-supplier

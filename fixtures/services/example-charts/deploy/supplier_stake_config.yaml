# Supplier stake config for the example supplier on beta, now serving two services.
# A supplier's service list is replaced, not appended, on every stake-supplier, so
# this file lists every service the supplier serves. Signed by the operator on the
# server (the Service Manager's Supply tab does this over SSH); the owner pays.
#
# stake_amount must be at least the live supplier min_stake (59,500 POKT on beta
# when this was written; re-check with the Skill's live_params.py before staking).

owner_address: pokt1qyqszqgpqyqszqgpqyqszqgpqyqszqgp04723y
operator_address: pokt1qgpqyqszqgpqyqszqgpqyqszqgpqyqsz73c06j
stake_amount: 59500000000upokt

default_rev_share_percent:
  pokt1qyqszqgpqyqszqgpqyqszqgpqyqszqgp04723y: 100

services:
  - service_id: example-builder-test
    endpoints:
      - publicly_exposed_url: https://services.example.org
        rpc_type: REST
  - service_id: example-charts
    endpoints:
      - publicly_exposed_url: https://services.example.org
        rpc_type: REST

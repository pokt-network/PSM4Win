# TLS termination in front of the RelayMiner for example-charts.
# Obtain a publicly trusted certificate (e.g. certbot) for services.example.org first.
# The public https URL is what you stake as the supplier's endpoint.
# Do NOT add auth here; every relay is already signed.

server {
    listen 443 ssl;
    http2 on;
    server_name services.example.org;

    ssl_certificate     /etc/letsencrypt/live/services.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/services.example.org/privkey.pem;

    client_max_body_size 20m;      # match the RelayMiner's max_body_size

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}

# HA RelayMiner stack for jinx-service-builder-test on beta: redis + miner + relayer.
# Run your backend separately and point relayer-config.yaml's backend url at it
# (e.g. join this network as an external service, or use host networking).
# Put a TLS reverse proxy in front of the relayer's :8080 and stake that https URL.

services:
  redis:
    image: redis:8.4-alpine
    container_name: jinx-service-builder-test-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [pocket]

  miner:
    image: ghcr.io/pokt-network/pocket-relay-miner:rc
    container_name: jinx-service-builder-test-miner
    command: ["miner", "--config", "/config/config.yaml"]
    volumes:
      - ./miner-config.yaml:/config/config.yaml:ro
      - ./supplier-keys.yaml:/keys/supplier-keys.yaml:ro
    ports:
      - "127.0.0.1:9092:9092"        # metrics, loopback only
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/metrics"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [pocket]

  relayer:
    image: ghcr.io/pokt-network/pocket-relay-miner:rc
    container_name: jinx-service-builder-test-relayer
    command: ["relayer", "--config", "/config/config.yaml"]
    volumes:
      - ./relayer-config.yaml:/config/config.yaml:ro
      - ./supplier-keys.yaml:/keys/supplier-keys.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"        # reverse proxy target, loopback only
      - "127.0.0.1:8081:8081"        # health, loopback only
      - "127.0.0.1:9090:9090"        # metrics, loopback only
    depends_on:
      redis: { condition: service_healthy }
      miner: { condition: service_healthy }
    networks: [pocket]

networks:
  pocket:
    name: jinx-service-builder-test-net

volumes:
  redis-data:

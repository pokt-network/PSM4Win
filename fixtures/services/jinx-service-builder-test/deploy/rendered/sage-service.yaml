# SAGE gateway configuration for jinx-service-builder-test. Publish this with the service docs.
# Gateways do NOT read the service card, so an operator must add this by hand or
# SAGE refuses rest requests for the service with a 400 before any
# session lookup. Keep the health checks in sync with the card's serving.healthcheck.
gateway_config:
  services:
    - id: jinx-service-builder-test
      type: passthrough            # relays and scores; understands no payload semantics
      rpc_types: ["rest"]
      timeout_config:
        relay_timeout: 30s
  active_health_checks:
    local:
      - service_id: jinx-service-builder-test
        enabled: true
        checks:
          - name: version
            type: rest
            method: GET
            path: /v1/version
            expected_status_code: 200
            reputation_signal: critical_error
            timeout: 5s
          - name: health
            type: rest
            method: GET
            path: /healthz
            expected_status_code: 200
            reputation_signal: major_error
            timeout: 5s
        # Do NOT add sync_check or sync_allowance to a non-blockchain service:
        # they assume a block height and mark every healthy supplier as failing.

# DEPRECATED: the single-process RelayMiner is scheduled for deprecation and cannot
# claim through the public Sauron gRPC endpoints. Use templates/ha/ instead.
#
# Backend + single-process RelayMiner for pretty-charts on beta.
# The reverse proxy (Caddy/nginx) runs in front of the relayminer and is not
# included here; point it at 127.0.0.1:8080.
#
# The operator key is mounted from a keyring directory you create with:
#   pocketd keys add operator --keyring-backend test --home ./pocket-home
# Use --keyring-backend file with a password file for anything beyond a test.

services:
  backend:
    # REPLACE with your service image, or build: ./backend
    image: REPLACE-your-backend-image
    container_name: pretty-charts-backend
    restart: unless-stopped
    # Expose only inside the compose network; the relayminer reaches it by name.
    expose:
      - "8080"
    networks: [pocket]

  relayminer:
    image: ghcr.io/pokt-network/pocketd:latest
    container_name: pretty-charts-relayminer
    restart: unless-stopped
    command:
      - relayminer
      - start
      - --config=/config/relayminer_config.yaml
      - --chain-id=pocket-lego-testnet
      - --keyring-backend=test
      - --home=/home
      - --grpc-insecure=false
    volumes:
      - ./relayminer_config.yaml:/config/relayminer_config.yaml:ro
      - ./pocket-home:/home            # keyring with the operator key
      - smt:/var/lib/pocket/smt        # persistent; matches smt_store_path
    ports:
      - "127.0.0.1:8080:8080"   # reverse proxy target, loopback only
      - "127.0.0.1:8081:8081"                          # ping, loopback only
      - "127.0.0.1:9090:9090"                          # metrics, loopback only
    depends_on: [backend]
    networks: [pocket]

networks:
  pocket:
    name: pretty-charts-net

volumes:
  smt:

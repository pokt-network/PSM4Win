# HA RelayMiner miner config, written by the Pocket Service Manager for beta.
# The miner claims and proves for every service this supplier serves.

redis:
  url: "redis://pocket-supplier-redis:6379"
  claim_idle_timeout_ms: 60000

pocket_node:
  chain_id: "pocket-lego-testnet"
  query_node_rpc_url: "https://sauron-rpc.beta.infra.pocket.network"
  query_node_grpc_url: "sauron-grpc.beta.infra.pocket.network:443"
  grpc_insecure: false
  query_timeout_seconds: 5

keys:
  keys_file: "/keys/supplier-keys.yaml"

block_time_seconds: 30

balance_monitor:
  enabled: true
  check_interval_seconds: 300
  balance_threshold_upokt: 10000

transaction:
  gas_limit: 0
  gas_price: "0.000001upokt"
  gas_adjustment: 1.7

leader_election:
  leader_ttl_seconds: 30
  heartbeat_rate_seconds: 10

metrics:
  enabled: true
  addr: "0.0.0.0:9092"

logging:
  level: "info"
  format: "json"
  output: "stdout"

# HA RelayMiner relayer config for the example supplier on beta.
# One entry under `services:` per service this supplier is staked for; the URL is
# the backend container's name on the pocket-supplier network. Adding a service
# means: start its backend on that network, add its entry here, recreate the
# relayer (docker compose -p pocket-supplier up -d --force-recreate relayer).

listen_addr: "0.0.0.0:8080"

redis:
  url: "redis://pocket-supplier-redis:6379"

keys:
  keys_file: "/keys/supplier-keys.yaml"

pocket_node:
  chain_id: "pocket-lego-testnet"
  query_node_rpc_url: "https://sauron-rpc.beta.infra.pocket.network"
  query_node_grpc_url: "sauron-grpc.beta.infra.pocket.network:443"
  grpc_insecure: false

services:
  example-builder-test:
    timeout_profile: fast
    max_body_size_bytes: 20971520
    default_backend: rest
    backends:
      rest:
        url: "http://example-builder-test-backend:8080"
        health_check:
          endpoint: "/healthz"
          interval_seconds: 10
          timeout_seconds: 5
  example-charts:
    timeout_profile: fast
    max_body_size_bytes: 20971520
    default_backend: rest
    backends:
      rest:
        url: "http://example-charts-backend:8080"
        health_check:
          endpoint: "/healthz"
          interval_seconds: 10
          timeout_seconds: 5

default_request_timeout_seconds: 30
default_max_body_size_bytes: 20971520

health_check:
  enabled: true
  addr: "0.0.0.0:8081"

timeout_profiles:
  fast:
    request_timeout_seconds: 30
    response_header_timeout_seconds: 30
    dial_timeout_seconds: 5
    tls_handshake_timeout_seconds: 10
  streaming:
    request_timeout_seconds: 600
    response_header_timeout_seconds: 0
    dial_timeout_seconds: 10
    tls_handshake_timeout_seconds: 15

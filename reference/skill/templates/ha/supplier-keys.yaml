# HA RelayMiner signing keys for the supplier (one operator per server, serving
# {{SERVICE_ID}} and every other service the supplier is staked for).
# One hex-encoded secp256k1 operator private key per line. The operator address is
# derived automatically. Export a key with:
#   pocketd keys export --unarmored-hex --unsafe {{OPERATOR_KEY_NAME}}
#
# SECURITY: this file holds a private key in cleartext. Never commit it. Mount it
# read-only from a secrets store (Docker/K8s secret, sops-encrypted file) and keep
# it out of version control and out of the render_templates answers file.
keys:
  - "REPLACE-64-hex-operator-private-key"

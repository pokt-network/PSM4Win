# TLS termination in front of the RelayMiner for {{SERVICE_ID}}.
# Obtain a publicly trusted certificate (e.g. certbot) for {{DOMAIN}} first.
# The public https URL is what you stake as the supplier's endpoint.
# Do NOT add auth here; every relay is already signed.

server {
    listen 443 ssl;
    http2 on;
    server_name {{DOMAIN}};

    ssl_certificate     /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;

    client_max_body_size 20m;      # match the RelayMiner's max_body_size

    location / {
        proxy_pass http://127.0.0.1:{{LISTEN_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}

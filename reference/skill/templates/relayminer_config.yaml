# DEPRECATED: the single-process RelayMiner is scheduled for deprecation and cannot
# claim through the public Sauron gRPC endpoints. Use templates/ha/ instead.
#
# Single-process RelayMiner config for {{SERVICE_ID}} on {{NETWORK}}.
# Start with:
#   pocketd relayminer start --config ./relayminer_config.yaml \
#     --chain-id {{CHAIN_ID}} --keyring-backend file --grpc-insecure=false
#
# The RelayMiner listens on plain HTTP; terminate TLS with the reverse proxy
# (Caddyfile / nginx.conf) and stake the proxy's public https URL.

default_signing_key_names:
  - {{OPERATOR_KEY_NAME}}          # the operator key's name in your keyring
default_request_timeout_seconds: 30
default_max_body_size: 20MB

# Persistent path for the Sparse Merkle Sum Trie. Losing it forfeits unclaimed relays.
smt_store_path: {{SMT_STORE_PATH}}

pocket_node:
  query_node_rpc_url: {{RPC_URL}}
  query_node_grpc_url: {{GRPC_URL}}
  tx_node_rpc_url: {{RPC_URL}}

metrics:
  enabled: true
  addr: :9090            # scrape-only; do not expose publicly
ping:
  enabled: true
  addr: :8081            # GET /ping -> 204 when all backends are reachable

suppliers:
  - service_id: {{SERVICE_ID}}
    listen_url: http://0.0.0.0:{{LISTEN_PORT}}      # the reverse proxy forwards here
    service_config:
      backend_url: {{BACKEND_URL}}
      forward_pocket_headers: true
    rpc_type_service_configs:
      # key is the card's rpc_types[].type, lowercased
      {{RPC_TYPE_LOWER}}:
        backend_url: {{BACKEND_URL}}
        forward_pocket_headers: true
